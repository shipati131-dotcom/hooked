<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b2a3a" />
    <title>HOOKED</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(ellipse at center, #123f52 0%, #081c27 100%);
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #game {
            width: 100%;
            height: 100%;
        }
        /* Pre-warm fonts so Phaser text can use them immediately */
        .font-warm { position: absolute; left: -9999px; top: -9999px; visibility: hidden; }
    </style>
</head>
<body>
    <div class="font-warm" style="font-family: Fredoka">Hooked</div>
    <div class="font-warm" style="font-family: Nunito">Hooked</div>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
