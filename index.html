<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b2a3a" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%8E%A3%3C/text%3E%3C/svg%3E" />
    <title>HOOKED</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #0b2a3a;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #game {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }
        #game canvas {
            display: block;
            width: 100vw !important;
            height: 100vh !important;
        }
        /* Pre-warm fonts so Phaser text can use them immediately */
        .font-warm { position: absolute; left: -9999px; top: -9999px; visibility: hidden; }
    </style>
</head>
<body>
    <div class="font-warm" style="font-family: Fredoka">Hooked</div>
    <div class="font-warm" style="font-family: Nunito">Hooked</div>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
